# @name: 扩展自动打包发布
# @Descripttion: 推送版本标签后构建 VSIX 并附带对应更新说明发布到 GitHub
# @version: 1.0.0
# @Author: sm
# @Date: 2026-10-08 16:55:45
# @LastEditTime: 2026-10-08 16:55:45
# @FilePath: .github/workflows/release.yml

name: Package VSIX on Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync version from tag
        run: |
          if [[ "${GITHUB_REF_NAME}" != v* ]]; then
            echo "Tag must start with v, got: ${GITHUB_REF_NAME}"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          node -e "const fs=require('fs'); const path='package.json'; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.version=process.env.VERSION; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n', 'utf8');"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install vsce
        run: pnpm add -g @vscode/vsce

      - name: Build
        run: pnpm run compile

      - name: Package VSIX
        run: pnpm run package

      - name: Resolve VSIX
        id: vsix
        run: |
          file=$(ls *.vsix | head -n 1)
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.vsix.outputs.file }}

      - name: Prepare release notes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const heading = `## ${process.env.GITHUB_REF_NAME} - `;
          const section = changelog.split(/^## /m).find((entry) => `## ${entry}`.startsWith(heading));
          if (!section) {
            throw new Error(`Missing changelog for ${process.env.GITHUB_REF_NAME}`);
          }
          const notes = section.slice(section.indexOf('\n') + 1).trim();
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'release-notes.md'), `${notes}\n`);
          NODE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: ${{ steps.vsix.outputs.file }}
